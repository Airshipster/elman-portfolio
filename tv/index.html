<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Bilik telekanalı — işçi versiya</title>
  <script src="vendor/hyperframes-player.global.js"></script>
  <script src="vendor/hyperframes-slideshow.global.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#07110f}
    hyperframes-slideshow{display:block;position:relative;width:100vw;height:100vh;outline:none}
    hyperframes-player{position:absolute;inset:0}
  </style>
</head>
<body>
  <hyperframes-slideshow tabindex="0" notes-storage-key="azerbaijan-knowledge-tv-draft">
    <hyperframes-player interactive src="composition/index.html"></hyperframes-player>
    <script type="application/hyperframes-slideshow+json">
    {
      "slides":[
        {"sceneId":"s01","notes":"Сразу назвать предложение: общедоступный телеканал о знаниях на азербайджанском языке. Это рабочая концепция, название можно поменять."},
        {"sceneId":"s02","notes":"Коротко объяснить, почему именно я принёс проект. Здесь нужны портрет, реальные проекты, публикации и фотографии выступлений."},
        {"sceneId":"s03","notes":"Показать, что у проекта уже есть база для поиска тем, форматов и потенциальных партнёров. Не называть субтитры готовыми сценариями."},
        {"sceneId":"s04","notes":"Упомянуть внешнее влияние коротко: зависимость от чужих площадок означает зависимость и от чужой повестки. Не превращать этот фрагмент в отдельное расследование."},
        {"sceneId":"s05iq","notes":"Оговорить прямо: IQ-тест не измеряет «ум народа», а онлайн-выборка не репрезентативна. Но внутри одной и той же процедуры Азербайджан занимает 57-е место, ниже Грузии и Армении."},
        {"sceneId":"s05","notes":"Сравнить Азербайджан с лидером и средним OECD, без отдельного акцента на Армении."},
        {"sceneId":"s05b","notes":"Показать долю школьников ниже базового уровня и почти отсутствующую верхнюю группу."},
        {"sceneId":"s05c","notes":"12,4 года формального обучения превращаются в 8,3 года обучения с поправкой на результат."},
        {"sceneId":"s05d","notes":"Разрыв по доходу семьи и месту проживания показывает силу среды."},
        {"sceneId":"s05e","notes":"В инновационном индексе результат заметно слабее созданных условий."},
        {"sceneId":"s05f","notes":"Сопоставление образовательного капитала со знакомыми странами; ни одну соседнюю страну специально не выделять."},
        {"sceneId":"s06","notes":"Здесь находится конкретная работа Министерства культуры: язык, местные герои, наследие, документалистика и новые медиапрофессии."},
        {"sceneId":"s07","notes":"Главная мысль проекта: современный мир должен регулярно объясняться на азербайджанском языке своими редакциями и авторами."},
        {"sceneId":"s08","notes":"Канал шире естественных наук. В него входят город, архитектура, технологии, история, профессии и проверка утверждений."},
        {"sceneId":"s09","notes":"Показать размах: это десятки повторяемых рубрик, а не перечень школьных предметов и не восемь общих жанров."},
        {"sceneId":"s10","notes":"Шесть примеров показывают двигатель выпуска: что происходит на экране и почему зритель досматривает."},
        {"sceneId":"s11","notes":"Это редакционная карта утверждений, на которые канал должен отвечать. Она не утверждает, сколько жителей верит в каждый миф."},
        {"sceneId":"s12","notes":"Часть эфира можно запускать через лицензирование и адаптацию. Права на каждый материал согласуются отдельно."},
        {"sceneId":"s13","notes":"Образование отвечает за содержание и связь с обучением. Культура — за язык, форму, авторов, наследие и производство."},
        {"sceneId":"s14","notes":"Просим не очередное исследование. Нужно согласовать концепцию и дать совместное поручение на подготовку запуска с понятным следующим решением."}
      ],
      "slideSequences":[]
    }
    </script>
  </hyperframes-slideshow>
  <script>
    const deck = document.querySelector("hyperframes-slideshow");
    deck.focus();
    let wheelLocked = false;
    function moveByWheel(direction) {
      if (wheelLocked || !deck.controller) return;
      wheelLocked = true;
      direction > 0 ? deck.controller.next() : deck.controller.prev();
      setTimeout(() => { wheelLocked = false; }, 560);
    }
    window.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) < 18) return;
      event.preventDefault();
      moveByWheel(event.deltaY);
    }, { passive: false });
    window.addEventListener("message", (event) => {
      if (event.data?.source === "knowledge-deck" && event.data?.type === "wheel-nav") moveByWheel(event.data.direction);
      if (event.data?.source === "knowledge-deck" && event.data?.type === "language") {
        document.documentElement.lang = event.data.language;
        document.title = event.data.language === "az" ? "Bilik telekanalı — işçi versiya" : "Телеканал о знаниях — рабочий черновик";
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.code !== "KeyM" || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
      event.preventDefault();
      document.querySelector("hyperframes-player")?.iframeElement?.contentWindow?.postMessage({ source: "knowledge-deck", type: "toggle-language" }, "*");
    }, true);
  </script>
</body>
</html>
