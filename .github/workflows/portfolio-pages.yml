name: Publish portfolio

on:
  push:
    branches: [main]
    paths-ignore:
      - "tv/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare portfolio without TV source files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-site"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/tv/' "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/portfolio-site/"
          test -f "$RUNNER_TEMP/portfolio-site/index.html"
          test ! -e "$RUNNER_TEMP/portfolio-site/tv"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portfolio-site
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4

